apiVersion: apps/v1
kind: Deployment
metadata:
  name: orgrebase-gemini-tool-bridge
  labels:
    app.kubernetes.io/name: orgrebase-gemini-tool-bridge
    app.kubernetes.io/part-of: orgrebase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orgrebase-gemini-tool-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orgrebase-gemini-tool-bridge
        app.kubernetes.io/part-of: orgrebase
    spec:
      containers:
        - name: bridge
          image: orgrebase/gemini-tool-bridge:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: VERTEX_UPSTREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: orgrebase-gemini-tool-bridge
                  key: vertex-upstream-url
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: orgrebase-gemini-tool-bridge
  labels:
    app.kubernetes.io/name: orgrebase-gemini-tool-bridge
    app.kubernetes.io/part-of: orgrebase
spec:
  selector:
    app.kubernetes.io/name: orgrebase-gemini-tool-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
