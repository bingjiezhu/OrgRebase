[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oac-ctk-runner"
version = "0.1.0a0"
description = "Code-independent black-box runner for frozen OAC CTK bundles"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.25,<5", "rfc8785>=0.1.4,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]
signatures = ["cryptography>=50,<51"]

[project.scripts]
oac-ctk = "oac_ctk_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oac_ctk_runner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
