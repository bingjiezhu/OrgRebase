name: Bug report
description: Report a reproducible OrgRebase problem without attaching secrets or restricted business data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OrgRebase. Remove credentials, restricted source text, raw prompts, model output, and private paths before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Workspace control plane
        - Local API (`make serve`)
        - AgentTeams assets or transport
        - Skill evaluation
        - Evidence / review readiness
        - Packaging or CLI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Prefer the synthetic demo and fixtures in this repository.
      placeholder: "1. uv sync --all-extras\n2. make workspace-demo\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include OS, Python version, and logs after removing secrets and private paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, credentials, restricted source text, raw prompts, model output, and personal paths.
          required: true
