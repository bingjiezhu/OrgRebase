name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (no OAC or service credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orgrebase
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked core environment
        run: |
          uv python install
          uv sync --locked --all-extras
      - name: Validate the core contributor path
        run: make check-core
      - name: Verify CI gating boundaries
        run: uv run --frozen pytest -W error tests/test_ci_workflow.py
      - name: Explain the validation boundary
        run: |
          printf '%s\n' 'Core checks do not qualify OAC integration, PostgreSQL, live services, or a release candidate.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The sibling oac-spec/ tree is present in this workspace clone. Full validation still needs PostgreSQL tools and is started with workflow_dispatch.' >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Full OAC and PostgreSQL validation
    needs: core
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orgrebase
    env:
      ORGREBASE_REQUIRE_POSTGRES_TESTS: "1"
      ORGREBASE_OAC_ROOT: ${{ github.workspace }}/oac-spec
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the sibling OAC tree
        run: test -f "$ORGREBASE_OAC_ROOT/pyproject.toml"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install PostgreSQL validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17
          printf '%s\n' /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Sync locked environment
        run: uv sync --locked --all-extras
      - name: Verify the in-tree OAC source before installing it
        run: uv run --frozen python scripts/verify_oac_dependency.py --root "$ORGREBASE_OAC_ROOT"
      - name: Install the locked OAC CLI environment
        run: uv sync --project "$ORGREBASE_OAC_ROOT" --locked --all-extras
      - name: Audit installed Python dependencies
        run: >-
          uv run --frozen --all-extras --with pip-audit==2.9.0
          pip-audit --local --skip-editable --progress-spinner off
      - name: Lint, asset validation, evidence, and tests
        run: make check

  release-candidate:
    name: Build and attest a reviewed candidate
    needs: [core, check]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.core.result == 'success' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: orgrebase
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install locked build environment
        run: |
          uv python install
          uv sync --frozen --all-extras
      - name: Build wheel and source archive
        run: uv build --out-dir dist
      - name: Bind SBOM to the exact artifacts
        run: |
          uv run --frozen python scripts/generate_sbom.py --artifact dist/*.whl --artifact dist/*.tar.gz --output dist/sbom.cdx.json
          uv run --frozen python scripts/generate_sbom.py --artifact dist/*.whl --artifact dist/*.tar.gz --output dist/sbom.cdx.json --check
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            orgrebase/dist/*.whl
            orgrebase/dist/*.tar.gz
      - name: Attest dependency inventory
        uses: actions/attest@v4
        with:
          subject-path: |
            orgrebase/dist/*.whl
            orgrebase/dist/*.tar.gz
          sbom-path: orgrebase/dist/sbom.cdx.json
      - name: Retain candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orgrebase-candidate-${{ github.sha }}
          path: orgrebase/dist/
          if-no-files-found: error
          retention-days: 30
