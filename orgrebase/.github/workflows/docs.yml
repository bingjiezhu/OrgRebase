name: Documentation

on:
  push:
    branches: [main]
    paths:
      # Linked-source pages can render files outside docs/.
      - orgrebase/**
      - oac-spec/**
      - .github/**
      - README.md
      - README.zh-CN.md
      - LICENSE
      - LICENSES.md
      - NOTICE.md
      - COMMERCIAL-LICENSE.md
      - CONTRIBUTING.md
      - Makefile
      - .python-version
  pull_request:
    paths:
      # Keep the PR preview in sync with every possible site input.
      - orgrebase/**
      - oac-spec/**
      - .github/**
      - README.md
      - README.zh-CN.md
      - LICENSE
      - LICENSES.md
      - NOTICE.md
      - COMMERCIAL-LICENSE.md
      - CONTRIBUTING.md
      - Makefile
      - .python-version
  workflow_dispatch:
    inputs:
      site_url:
        description: Optional final HTTPS Pages URL (including repository base path)
        type: string
        required: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: orgrebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            orgrebase/uv.lock
            orgrebase/documentation/uv.lock
      - name: Install the isolated source-packaging environment
        run: |
          uv python install
          uv sync --locked
      - name: Build and verify matching public source
        run: |
          uv run --frozen python scripts/build_source_snapshot.py build \
            --orgrebase-root "$GITHUB_WORKSPACE/orgrebase" --oac-root "$GITHUB_WORKSPACE/oac-spec" \
            --profile github --output-dir "$RUNNER_TEMP/orgrebase-docs-source"
          uv run --frozen python scripts/build_source_snapshot.py verify \
            --orgrebase-root "$GITHUB_WORKSPACE/orgrebase" --oac-root "$GITHUB_WORKSPACE/oac-spec" \
            --profile github --output-dir "$RUNNER_TEMP/orgrebase-docs-source"
      - name: Install isolated documentation toolchain
        run: uv sync --project documentation --locked --python 3.12.13
      - name: Build static documentation
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          source="$RUNNER_TEMP/orgrebase-docs-source/orgrebase-oac-source-snapshot.zip"
          digest="$(python3 -c 'import hashlib, sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' "$source")"
          args=(--output "$RUNNER_TEMP/orgrebase-docs" --source-archive "$source" --source-sha256 "$digest")
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            url="${SITE_URL:-https://bingjiezhu.github.io/OrgRebase/}"
            args+=(--site-url "$url")
          fi
          uv run --project documentation --frozen python documentation/build.py \
            "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/orgrebase-docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/orgrebase-docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
