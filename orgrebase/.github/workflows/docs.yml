name: Documentation

on:
  push:
    branches: [main]
    paths:
      - orgrebase/docs/**
      - orgrebase/README.md
      - orgrebase/README.zh-CN.md
      - orgrebase/CONTRIBUTING.md
      - orgrebase/SECURITY.md
      - orgrebase/documentation/**
      - orgrebase/.github/workflows/docs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      site_url:
        description: Optional final HTTPS Pages URL (including repository base path)
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: orgrebase
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: orgrebase/documentation/uv.lock
      - name: Install isolated documentation toolchain
        run: uv sync --project documentation --locked --python 3.12.13
      - name: Build static documentation
        run: |
          url="${{ github.event.inputs.site_url }}"
          if [ -z "$url" ]; then url="https://bingjiezhu.github.io/OrgRebase/"; fi
          uv run --project documentation --frozen python documentation/build.py \
            --output "$RUNNER_TEMP/orgrebase-docs" \
            --site-url "$url"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/orgrebase-docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/orgrebase-docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static site
        id: deployment
        uses: actions/deploy-pages@v4
