<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OrgRebase 系统总架构</title>
  <style>
    :root {
      --paper: #f8f6f1;
      --panel: #fffdfa;
      --ink: #1d1d1b;
      --muted: #77736b;
      --soft: #a49e94;
      --rule: #cfc7bb;
      --accent: #ff5a2f;
      --accent-tint: #fff0e8;
      --blue: #2e5d89;
      --blue-tint: #edf4f9;
      --green: #2f7657;
      --green-tint: #edf7f2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
    body { color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: 1600px; height: 900px; margin: 0 auto; padding: 48px 64px 32px; background: var(--paper); }
    header { display: flex; align-items: flex-start; justify-content: space-between; height: 112px; border-bottom: 1px solid var(--rule); }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 40px; font-weight: 500; line-height: 1.12; }
    header p { width: 540px; margin: 8px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .tag { margin-top: 4px; padding: 8px 16px; border: 1px solid var(--accent); border-radius: 16px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    figure { margin: 24px 0 0; }
    svg { display: block; width: 1472px; height: 664px; }
    .legend { display: flex; align-items: center; gap: 32px; height: 48px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
    .legend b { color: var(--ink); }
    .legend span::before { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -2px; border: 1px solid var(--rule); content: ""; }
    .legend .candidate::before { background: var(--blue-tint); border-color: var(--blue); }
    .legend .human::before { background: var(--accent-tint); border-color: var(--accent); }
    .legend .state::before { background: var(--green-tint); border-color: var(--green); }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">系统架构</p>
      <h1>两个持续演化环，运行在三个权责平面上</h1>
      <p>左边把企业材料编译为可执行组织契约；右边让员工任务在契约中动态组队、受控执行并选择性更新。</p>
    </div>
    <span class="tag">系统架构</span>
  </header>

  <figure aria-labelledby="architecture-caption">
    <svg viewBox="0 0 1472 664" role="img" aria-labelledby="orgrebase-architecture-title orgrebase-architecture-desc">
      <title id="orgrebase-architecture-title">OrgRebase 两环三平面系统架构</title>
      <desc id="orgrebase-architecture-desc">企业接入环把五类材料编译为 OAC 组织契约，持续工作环把员工任务编译为动态 AgentTeams 计划，OrgRebase 控制面与人工责任人决定候选是否写入规范状态，全链路由证据平面记录。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#77736b" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#ff5a2f" />
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#2e5d89" />
        </marker>
      </defs>

      <!-- zones -->
      <rect x="0" y="0" width="496" height="472" rx="8" fill="#fffdfa" stroke="#cfc7bb" />
      <rect x="520" y="0" width="952" height="472" rx="8" fill="#fffdfa" stroke="#cfc7bb" />
      <rect x="0" y="496" width="1472" height="120" rx="8" fill="#f1eee8" stroke="#cfc7bb" />
      <rect x="20" y="12" width="108" height="20" rx="2" fill="#f8f6f1" />
      <text x="24" y="27" fill="#77736b" font-size="12" font-weight="700" letter-spacing="1.2">企业接入环</text>
      <rect x="540" y="12" width="108" height="20" rx="2" fill="#f8f6f1" />
      <text x="544" y="27" fill="#77736b" font-size="12" font-weight="700" letter-spacing="1.2">持续工作环</text>
      <rect x="20" y="508" width="112" height="20" rx="2" fill="#f8f6f1" />
      <text x="24" y="523" fill="#77736b" font-size="12" font-weight="700" letter-spacing="1.2">证据与运行面</text>

      <!-- connectors: onboarding -->
      <line x1="152" y1="180" x2="188" y2="180" stroke="#77736b" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="356" y1="180" x2="388" y2="180" stroke="#77736b" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M 420,236 V 320 Q 420,328 412,328 H 280 Q 272,328 272,320 V 260" fill="none" stroke="#ff5a2f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-accent)" />
      <rect x="312" y="310" width="72" height="16" rx="2" fill="#fffdfa" />
      <text x="348" y="322" text-anchor="middle" fill="#ff5a2f" font-size="12" font-weight="700">契约变更</text>

      <!-- connectors: daily -->
      <line x1="692" y1="180" x2="732" y2="180" stroke="#77736b" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="904" y1="180" x2="944" y2="180" stroke="#2e5d89" stroke-width="2" marker-end="url(#arrow-link)" />
      <line x1="1132" y1="180" x2="1172" y2="180" stroke="#ff5a2f" stroke-width="2.4" marker-end="url(#arrow-accent)" />
      <line x1="1364" y1="180" x2="1380" y2="180" stroke="#2f7657" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M 1324,244 V 332 Q 1324,340 1316,340 H 620 Q 612,340 612,332 V 260" fill="none" stroke="#77736b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
      <rect x="920" y="328" width="116" height="16" rx="2" fill="#fffdfa" />
      <text x="978" y="340" text-anchor="middle" fill="#77736b" font-size="12" font-weight="700">下一次事实变化</text>

      <!-- evidence collectors -->
      <path d="M 272,244 V 480 Q 272,488 280,488 H 432 Q 440,488 440,496" fill="none" stroke="#77736b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
      <path d="M 1038,244 V 480 Q 1038,488 1046,488 H 1080 Q 1088,488 1088,496" fill="none" stroke="#77736b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
      <path d="M 1268,244 V 480 Q 1268,488 1260,488 H 1216 Q 1208,488 1208,496" fill="none" stroke="#77736b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

      <!-- onboarding nodes -->
      <g>
        <rect x="24" y="112" width="128" height="136" rx="6" fill="#f5f2ec" stroke="#a49e94" />
        <rect x="36" y="124" width="52" height="20" rx="2" fill="none" stroke="#a49e94" />
        <text x="62" y="138" text-anchor="middle" fill="#77736b" font-size="12" font-weight="700">输入</text>
        <text x="88" y="172" text-anchor="middle" fill="#1d1d1b" font-size="18" font-weight="700">五类企业材料</text>
        <text x="88" y="200" text-anchor="middle" fill="#77736b" font-size="12">领域 · 知识 · 权限</text>
        <text x="88" y="220" text-anchor="middle" fill="#77736b" font-size="12">能力 · 依赖</text>
      </g>
      <g>
        <rect x="188" y="96" width="168" height="168" rx="6" fill="#fff0e8" stroke="#ff5a2f" stroke-width="2" />
        <rect x="200" y="108" width="52" height="20" rx="2" fill="none" stroke="#ff5a2f" />
        <text x="226" y="122" text-anchor="middle" fill="#ff5a2f" font-size="12" font-weight="700">OAC</text>
        <text x="272" y="164" text-anchor="middle" fill="#1d1d1b" font-size="20" font-weight="700">组织契约</text>
        <text x="272" y="196" text-anchor="middle" fill="#77736b" font-size="12">接入 Agent 映射候选</text>
        <text x="272" y="216" text-anchor="middle" fill="#77736b" font-size="12">未知项 · 上下文 · 权威边界</text>
        <text x="272" y="240" text-anchor="middle" fill="#ff5a2f" font-size="12" font-weight="700">报价业务写入 0</text>
      </g>
      <g>
        <rect x="388" y="112" width="84" height="136" rx="6" fill="#fffdfa" stroke="#1d1d1b" />
        <rect x="400" y="124" width="52" height="20" rx="2" fill="none" stroke="#1d1d1b" />
        <text x="426" y="138" text-anchor="middle" fill="#1d1d1b" font-size="12" font-weight="700">准入</text>
        <text x="430" y="172" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">契约负责人</text>
        <text x="430" y="204" text-anchor="middle" fill="#77736b" font-size="12">校验</text>
        <text x="430" y="224" text-anchor="middle" fill="#77736b" font-size="12">四秒审阅门</text>
      </g>

      <!-- daily nodes -->
      <g>
        <rect x="548" y="112" width="144" height="136" rx="6" fill="#f5f2ec" stroke="#a49e94" />
        <rect x="560" y="124" width="52" height="20" rx="2" fill="none" stroke="#a49e94" />
        <text x="586" y="138" text-anchor="middle" fill="#77736b" font-size="12" font-weight="700">意图</text>
        <text x="620" y="172" text-anchor="middle" fill="#1d1d1b" font-size="18" font-weight="700">员工工作说明</text>
        <text x="620" y="204" text-anchor="middle" fill="#77736b" font-size="12">准备 → 确认 → 启动</text>
        <text x="620" y="224" text-anchor="middle" fill="#77736b" font-size="12">Prompt 不授权</text>
      </g>
      <g>
        <rect x="732" y="96" width="172" height="168" rx="6" fill="#edf4f9" stroke="#2e5d89" />
        <rect x="744" y="108" width="68" height="20" rx="2" fill="none" stroke="#2e5d89" />
        <text x="778" y="122" text-anchor="middle" fill="#2e5d89" font-size="12" font-weight="700">编译</text>
        <text x="818" y="164" text-anchor="middle" fill="#1d1d1b" font-size="20" font-weight="700">动态任务形成</text>
        <text x="818" y="196" text-anchor="middle" fill="#77736b" font-size="12">OAC + 任务目标</text>
        <text x="818" y="216" text-anchor="middle" fill="#77736b" font-size="12">最小团队 · 最小上下文</text>
        <text x="818" y="240" text-anchor="middle" fill="#2e5d89" font-size="12" font-weight="700">运行内冻结计划</text>
      </g>
      <g>
        <rect x="944" y="96" width="188" height="168" rx="6" fill="#fffdfa" stroke="#2e5d89" />
        <rect x="956" y="108" width="88" height="20" rx="2" fill="none" stroke="#2e5d89" />
        <text x="1000" y="122" text-anchor="middle" fill="#2e5d89" font-size="12" font-weight="700">执行面</text>
        <text x="1038" y="160" text-anchor="middle" fill="#1d1d1b" font-size="20" font-weight="700">AgentTeams</text>
        <text x="1038" y="190" text-anchor="middle" fill="#77736b" font-size="12">领域 Agent · Reviewer</text>
        <text x="1038" y="210" text-anchor="middle" fill="#77736b" font-size="12">Agent 调用 Tool / Skill</text>
        <text x="1038" y="238" text-anchor="middle" fill="#2e5d89" font-size="12" font-weight="700">只生成候选与执行事实</text>
      </g>
      <g>
        <rect x="1172" y="84" width="192" height="192" rx="6" fill="#fff0e8" stroke="#ff5a2f" stroke-width="2" />
        <rect x="1184" y="96" width="88" height="20" rx="2" fill="none" stroke="#ff5a2f" />
        <text x="1228" y="110" text-anchor="middle" fill="#ff5a2f" font-size="12" font-weight="700">决策面</text>
        <text x="1268" y="150" text-anchor="middle" fill="#1d1d1b" font-size="20" font-weight="700">OrgRebase 控制面</text>
        <text x="1268" y="182" text-anchor="middle" fill="#77736b" font-size="12">候选验收 · 冲突防线</text>
        <text x="1268" y="202" text-anchor="middle" fill="#77736b" font-size="12">精确负责人批准</text>
        <text x="1268" y="222" text-anchor="middle" fill="#77736b" font-size="12">选择性 Rebase</text>
        <text x="1268" y="252" text-anchor="middle" fill="#ff5a2f" font-size="12" font-weight="700">唯一规范写入路径</text>
      </g>
      <g>
        <rect x="1380" y="112" width="72" height="136" rx="6" fill="#edf7f2" stroke="#2f7657" />
        <rect x="1392" y="124" width="48" height="20" rx="2" fill="none" stroke="#2f7657" />
        <text x="1416" y="138" text-anchor="middle" fill="#2f7657" font-size="12" font-weight="700">状态</text>
        <text x="1416" y="172" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">规范</text>
        <text x="1416" y="194" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">业务</text>
        <text x="1416" y="216" text-anchor="middle" fill="#2f7657" font-size="12">交付物</text>
      </g>

      <!-- evidence plane -->
      <g>
        <rect x="48" y="536" width="240" height="56" rx="6" fill="#fffdfa" stroke="#77736b" />
        <text x="168" y="560" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">运行身份与事件链</text>
        <text x="168" y="580" text-anchor="middle" fill="#77736b" font-size="12">run_id · trace · digest</text>
      </g>
      <g>
        <rect x="320" y="536" width="240" height="56" rx="6" fill="#fffdfa" stroke="#77736b" />
        <text x="440" y="560" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">AgentTeams / Tool / Skill 回执</text>
        <text x="440" y="580" text-anchor="middle" fill="#77736b" font-size="12">任务 · 交接 · 调用 · 候选</text>
      </g>
      <g>
        <rect x="592" y="536" width="240" height="56" rx="6" fill="#fffdfa" stroke="#77736b" />
        <text x="712" y="560" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">OTLP 可观测</text>
        <text x="712" y="580" text-anchor="middle" fill="#77736b" font-size="12">trace · log · metric · alert</text>
      </g>
      <g>
        <rect x="864" y="536" width="240" height="56" rx="6" fill="#fffdfa" stroke="#77736b" />
        <text x="984" y="560" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">评测与发布治理</text>
        <text x="984" y="580" text-anchor="middle" fill="#77736b" font-size="12">Skill 分区 · 准入 · 回滚</text>
      </g>
      <g>
        <rect x="1136" y="536" width="288" height="56" rx="6" fill="#fffdfa" stroke="#77736b" />
        <text x="1280" y="560" text-anchor="middle" fill="#1d1d1b" font-size="16" font-weight="700">留存、告警、容量与恢复</text>
        <text x="1280" y="580" text-anchor="middle" fill="#77736b" font-size="12">SQLite · backup · replay · SBOM</text>
      </g>
    </svg>
    <figcaption id="architecture-caption" class="legend">
      <b>三个平面</b>
      <span class="candidate">Agent / Tool / Skill 生成候选</span>
      <span class="human">OrgRebase + 人工责任人决定生效</span>
      <span class="state">规范状态与交付物持久化</span>
      <span>全链路由证据面记录，但不借用跨运行结论</span>
    </figcaption>
  </figure>
</main>
</body>
</html>
