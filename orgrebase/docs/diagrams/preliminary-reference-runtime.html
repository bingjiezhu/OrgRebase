<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrgRebase 初赛版架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px;
      background:var(--paper); color:var(--ink); font-family:'Geist','PingFang SC','Hiragino Sans GB',sans-serif; }
    .frame { width:100%; max-width:1280px; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 8px/1 'Geist Mono',monospace;
      letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; color:var(--ink); font:400 28px/1.15 'Instrument Serif','Songti SC',serif; }
    svg { display:block; width:100%; min-width:960px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">ARCHITECTURE · PRELIMINARY REFERENCE RUNTIME</p>
    <h1>初赛版：企业成果可以随变化可信重建</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="preliminary-reference-runtime-title preliminary-reference-runtime-desc">
      <title id="preliminary-reference-runtime-title">OrgRebase 初赛版架构</title>
      <desc id="preliminary-reference-runtime-desc">固定企业事实和候选 Agent 经由形成、影响分析、Owner 审批和确定性写入，产生版本化 Quote 与证据链；Agent 直接写入被边界拒绝。</desc>
      <defs>
        <marker id="preliminary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="preliminary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Trust zones -->
      <rect x="240" y="120" width="600" height="400" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="264" y="124" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="336" y="136" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">DETERMINISTIC CONTROL</text>
      <rect x="880" y="120" width="320" height="400" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.50)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="904" y="124" width="136" height="16" rx="2" fill="#f5f5f5"/>
      <text x="972" y="136" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">CANONICAL STATE</text>

      <!-- Approved paths, drawn before nodes -->
      <line x1="200" y1="276" x2="280" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#preliminary-arrow)"/>
      <path d="M 200,416 H 236 Q 244,416 244,408 V 324 Q 244,316 252,316 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#preliminary-arrow)"/>
      <line x1="440" y1="276" x2="480" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#preliminary-arrow)"/>
      <line x1="640" y1="276" x2="680" y2="276" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#preliminary-arrow-accent)"/>
      <line x1="800" y1="276" x2="920" y2="276" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#preliminary-arrow-accent)"/>
      <line x1="1000" y1="312" x2="1000" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#preliminary-arrow)"/>

      <!-- Forbidden bypass stops before canonical boundary -->
      <path d="M 200,444 H 224 Q 232,444 232,452 V 488 H 856" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="864" y1="476" x2="864" y2="500" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="856" y1="480" x2="872" y2="496" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="872" y1="480" x2="856" y2="496" stroke="#2d3142" stroke-width="1.2"/>

      <!-- Arrow labels with visible gap -->
      <rect x="204" y="248" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="240" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">事实准入</text>
      <rect x="444" y="248" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="460" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">TRACE</text>
      <rect x="640" y="248" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="660" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">预演</text>
      <rect x="832" y="248" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="860" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">批准写入</text>
      <rect x="504" y="460" width="152" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">直接写入企业真相：拒绝</text>

      <!-- Nodes -->
      <g>
        <rect x="40" y="240" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="160" height="72" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
        <rect x="48" y="248" width="40" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,.45)"/>
        <text x="68" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">INPUT</text>
        <text x="120" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">固定企业事实</text>
        <text x="120" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Northstar · Acme Quote</text>
      </g>
      <g>
        <rect x="40" y="380" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="380" width="160" height="72" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/>
        <rect x="48" y="388" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.30)"/>
        <text x="72" y="400" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">AGENT</text>
        <text x="120" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">领域候选者</text>
        <text x="120" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Product · Legal · Finance · GTM</text>
      </g>
      <g>
        <rect x="280" y="240" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="240" width="160" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="288" y="248" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)"/>
        <text x="308" y="260" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">FORM</text>
        <text x="360" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">形成与真实读取</text>
        <text x="360" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Reference Monitor → WorkTrace</text>
      </g>
      <g>
        <rect x="480" y="240" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="240" width="160" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
        <rect x="488" y="248" width="40" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,.50)"/>
        <text x="508" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">GATE</text>
        <text x="560" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">影响与精确 VMRC</text>
        <text x="560" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">AFFECTED · KEEP · UNKNOWN</text>
      </g>
      <g>
        <rect x="680" y="240" width="120" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="240" width="120" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="688" y="248" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)"/>
        <text x="708" y="260" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">OWNER</text>
        <text x="740" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">显式审批</text>
        <text x="740" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">digest-bound</text>
      </g>
      <g>
        <rect x="920" y="240" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="240" width="160" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
        <rect x="928" y="248" width="48" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,.50)"/>
        <text x="952" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">WRITE</text>
        <text x="1000" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">版本化成果</text>
        <text x="1000" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Quote v1 → v2 → v3 · SQLite</text>
      </g>
      <g>
        <rect x="920" y="380" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="380" width="160" height="72" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
        <rect x="928" y="388" width="48" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,.50)"/>
        <text x="952" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">AUDIT</text>
        <text x="1000" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC',sans-serif" text-anchor="middle">收据与事件链</text>
        <text x="1000" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">restart · export · rollback</text>
      </g>

      <!-- Bottom legend -->
      <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
      <rect x="128" y="656" width="16" height="12" rx="2" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="152" y="668" fill="#4f5d75" font-size="8" font-family="'Geist','PingFang SC',sans-serif">关键决策 / 写入</text>
      <rect x="288" y="656" width="16" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="312" y="668" fill="#4f5d75" font-size="8" font-family="'Geist','PingFang SC',sans-serif">确定性控制</text>
      <line x1="424" y1="664" x2="456" y2="664" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="464" y="668" fill="#4f5d75" font-size="8" font-family="'Geist','PingFang SC',sans-serif">禁止的绕过路径</text>
      <text x="816" y="668" fill="#7a8399" font-size="8" font-family="'Geist','PingFang SC',sans-serif">核心能力：变化发生后，只重建受影响的企业成果</text>
    </svg>
  </main>
</body>
</html>
